name: CI

on:
  push:
    branches: [main, VPS_Ready]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy URL: needed only for `prisma generate` / build-time evaluation.
  # All API routes are force-dynamic, so no real DB is required in CI.
  DATABASE_URL: postgresql://postgres:password@localhost:5432/tgmon
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Check forbidden U+2014 in src, docs, scripts
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const bad = [];
            function walk(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) { walk(full); continue; }
                const lines = fs.readFileSync(full, "utf8").split(/\r?\n/);
                lines.forEach((line, idx) => {
                  if (line.includes("\u2014")) bad.push(`${full}:${idx + 1}`);
                });
              }
            }
            for (const dir of ["src", "docs", "scripts"]) walk(dir);
            if (bad.length > 0) {
              console.error("Forbidden U+2014 found:\n" + bad.join("\n"));
              process.exit(1);
            }
            console.log("OK: 0 occurrences of U+2014 in src/, docs/, scripts/");
          '

      - name: Unit tests (vitest)
        run: npm test

  integration-postgres:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tgmon_ai87_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tgmon_ai87_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/tgmon_ai87_test?schema=public
      RUN_DB_INTEGRATION_TESTS: "true"
      AI_OPERATIONS_INTEGRATION: "1"
      PUBLICATION_PERFORMANCE_INTEGRATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Deploy Prisma migrations
        run: npx prisma migrate deploy

      - name: Run PostgreSQL integration tests
        run: npx vitest run src/lib/ai-operations/__tests__/store.integration.test.ts src/lib/metrics/__tests__/publication-performance.integration.test.ts --fileParallelism=false

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: [lint-typecheck-test, integration-postgres]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
