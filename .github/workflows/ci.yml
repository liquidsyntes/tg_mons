name: CI

on:
  push:
    branches: [main, VPS_Ready]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy URL: needed only for `prisma generate` / build-time evaluation.
  # All API routes are force-dynamic, so no real DB is required in CI.
  DATABASE_URL: postgresql://postgres:password@localhost:5432/tgmon
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Check forbidden U+2014 in src, docs, scripts
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const bad = [];
            function walk(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) { walk(full); continue; }
                const lines = fs.readFileSync(full, "utf8").split(/\r?\n/);
                lines.forEach((line, idx) => {
                  if (line.includes("\u2014")) bad.push(`${full}:${idx + 1}`);
                });
              }
            }
            for (const dir of ["src", "docs", "scripts"]) walk(dir);
            if (bad.length > 0) {
              console.error("Forbidden U+2014 found:\n" + bad.join("\n"));
              process.exit(1);
            }
            console.log("OK: 0 occurrences of U+2014 in src/, docs/, scripts/");
          '

      - name: Unit tests (vitest)
        run: npm test

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
