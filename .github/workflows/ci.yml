name: CI

on:
  push:
    branches: [main, VPS_Ready]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy URL: needed only for `prisma generate` / build-time evaluation.
  # All API routes are force-dynamic, so no real DB is required in CI.
  DATABASE_URL: postgresql://postgres:password@localhost:5432/tgmon
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      # Scoped to src/ on purpose: one-off scratch scripts (fix*.js,
      # export_block.js) in the repo root would fail lint. Widen to
      # `npx eslint .` once those files are removed.
      - name: ESLint
        run: npx eslint src

      - name: Unit tests (vitest)
        run: npm test

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build
