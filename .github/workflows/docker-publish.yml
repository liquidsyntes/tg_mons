name: Publish containers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  web:
    name: web image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (web)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/liquidsyntes/tg_mons-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push (web)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            APP_COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  worker:
    name: worker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (worker)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/liquidsyntes/tg_mons-worker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push (worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  public:
    name: Make packages public
    runs-on: ubuntu-latest
    needs: [web, worker]
    permissions:
      packages: write
    continue-on-error: true
    steps:
      - name: Set GHCR packages public
        env:
          GH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Секрет GHCR_PAT не задан — пропускаю смену видимости. Пакет останется приватным; добавь секрет или сделай публичным вручную."
            exit 0
          fi
          for pkg in tg_mons-web tg_mons-worker; do
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/$pkg/visibility" \
              --input - <<< '{"visibility":"public"}' \
              || echo "::warning::Не удалось сделать $pkg публичным"
          done
