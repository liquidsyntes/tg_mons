# Локальный override: использует изолированную локальную сессию TG_SESSION_LOCAL,
# чтобы локальный worker в Docker не конфликтовал (AuthKeyDuplicated) с серверной TG_SESSION.

services:
  worker:
    environment:
      WORKER_LOCAL_MODE: "true"
      TG_SESSION_LOCAL: ${TG_SESSION_LOCAL:-}
      WORKER_DISABLE_CRON: ${WORKER_DISABLE_CRON:-false}