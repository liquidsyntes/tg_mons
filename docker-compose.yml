services:
  postgres:
    image: postgres:15
    container_name: tgmon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tgmon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tgmon"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: tgmon-web
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/tgmon?schema=public"
      COLLECT_API_TOKEN: ${COLLECT_API_TOKEN}
      WORKER_INTERNAL_URL: ${WORKER_INTERNAL_URL:-http://worker:4001}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      HEALTH_STUCK_THRESHOLD_MINUTES: ${HEALTH_STUCK_THRESHOLD_MINUTES:-120}
      HEALTH_STALE_THRESHOLD_MINUTES: ${HEALTH_STALE_THRESHOLD_MINUTES:-720}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: tgmon-worker
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/tgmon?schema=public"
      TG_API_ID: ${TG_API_ID}
      TG_API_HASH: ${TG_API_HASH}
      TG_SESSION: ${TG_SESSION}
      COLLECT_CRON: ${COLLECT_CRON:-0 * * * *}
      COLLECT_ON_STARTUP: ${COLLECT_ON_STARTUP:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      COLLECT_API_TOKEN: ${COLLECT_API_TOKEN}
      WEB_INTERNAL_URL: ${WEB_INTERNAL_URL:-http://web:4000}
      EVENTS_SCAN_CRON: ${EVENTS_SCAN_CRON:-}
      WORKER_INTERNAL_HOST: 0.0.0.0
      HEALTH_STUCK_THRESHOLD_MINUTES: ${HEALTH_STUCK_THRESHOLD_MINUTES:-120}
    expose:
      - "4001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
