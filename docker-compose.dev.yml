services:
  web:
    # Используем тот же образ, но переопределяем команду на dev
    command: npm run dev
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      # Пробрасываем текущую папку внутрь контейнера
      - .:/app
      # Исключаем локальные node_modules и .next, чтобы не было конфликтов с контейнером
      - /app/node_modules
      - /app/.next

  worker:
    command: npx tsx watch src/worker/index.ts --local
    environment:
      - NODE_ENV=development
      - WORKER_LOCAL_MODE=true
      - TG_SESSION_LOCAL=${TG_SESSION_LOCAL:-}
      - WORKER_DISABLE_CRON=${WORKER_DISABLE_CRON:-false}
    volumes:
      - .:/app
      - /app/node_modules
